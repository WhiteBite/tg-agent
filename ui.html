<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Рабочее место для контроля проектов по переписке: задачи, решения и сообщения-доказательства."
    />
    <title>TG Agent · Требует внимания</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233390ec'/%3E%3Cpath d='M8 10h16M16 10v14' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/workspace.css" />
    <script defer src="/assets/workspace.js"></script>
    <script defer src="/assets/workspace_entities.js"></script>
    <script defer src="/assets/workspace_projects.js"></script>
    <script defer src="/assets/workspace_messages.js"></script>
    <script defer src="/assets/workspace_analysis.js"></script>
    <script defer src="/assets/workspace_catalog.js"></script>
    <script defer src="/assets/workspace_engine.js"></script>
    <script defer src="/assets/workspace_links.js"></script>
    <script defer src="/assets/workspace_global.js"></script>
    <script defer src="/assets/workspace_settings.js"></script>
    <script defer src="/assets/workspace_downloads.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">К содержимому</a>
    <div class="app-shell">
      <aside class="sidenav" id="navigation" aria-label="Рабочее пространство">
        <button
          class="icon-button nav-close"
          id="nav-close"
          aria-label="Закрыть навигацию"
        ></button>
        <a class="brand" href="#attention"
          ><span class="brand-mark">TG</span
          ><span>TG Agent<small>Контроль проектов</small></span></a
        >
        <nav id="main-nav" aria-label="Основная навигация"></nav>
        <div class="nav-bottom">
          <div class="local-note">
            <span class="dot"></span>Локальные данные<small
              >Переписка остаётся на этой машине</small
            >
          </div>
        </div>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <button
            class="icon-button mobile-menu"
            id="menu-toggle"
            aria-label="Открыть навигацию"
            aria-expanded="false"
          ></button>
          <div class="breadcrumb" id="breadcrumb">Рабочее пространство</div>
          <form class="global-search" id="global-search" role="search">
            <label class="sr-only" for="global-query"
              >Поиск задач и сообщений</label
            ><span id="search-icon"></span
            ><input
              id="global-query"
              type="search"
              placeholder="Найти задачу, решение или сообщение"
            /><button type="submit" class="text-button">Найти</button>
          </form>
          <select
            class="account-switcher"
            id="account-switcher"
            aria-label="Источник (аккаунт)"
            hidden
          ></select>
          <button
            class="icon-button"
            id="theme-toggle"
            aria-label="Переключить тему"
          ></button>
        </header>
        <main id="main" tabindex="-1">
          <div class="page-heading">
            <div>
              <div class="eyebrow" id="page-eyebrow">Контроль по переписке</div>
              <h1 id="page-title">Требует внимания</h1>
              <p id="page-subtitle">
                Сначала важное. Рядом с каждым выводом — его источник.
              </p>
            </div>
            <div id="page-actions" class="cluster"></div>
          </div>
          <div class="freshness" id="freshness" aria-live="polite"></div>
          <div class="view" id="view">
            <div class="loading" role="status">
              Загружаем рабочее пространство…
            </div>
          </div>
        </main>
        <footer class="workspace-footer">
          <span>Выводы агента требуют проверки по источникам</span
          ><span id="footer-state">Подключение…</span>
        </footer>
      </div>
    </div>
    <div class="nav-scrim" id="nav-scrim" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <dialog id="entity-drawer" class="drawer" aria-labelledby="drawer-title">
      <div id="drawer-content"></div>
    </dialog>
    <dialog id="setup-dialog" class="modal" aria-labelledby="setup-title">
      <div id="setup-content"></div>
    </dialog>
    <noscript
      ><p class="notice danger">
        Для работы интерфейса нужен JavaScript. Данные доступны также через CLI
        и MCP.
      </p></noscript
    >
  </body>
</html>
